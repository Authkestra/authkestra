[workspace]
resolver = "2"
members = [
    "crates/authkestra-engine",
    "crates/authkestra-providers",
    "crates/authkestra-axum",
    "crates/authkestra-macros",
    "crates/authkestra-oidc",
    "crates/authkestra-actix",
    "crates/authkestra-resource",
    "crates/authkestra",

    "crates/authkestra-op",
    "crates/authkestra-devsig", "crates/authkestra-crypto-util", "crates/authkestra-store-testsuite",
    "crates/authkestra-store-sqlx",
    "crates/authkestra-example-seaorm",
    "crates/authkestra-example-diesel",
    "crates/authkestra-facade-tests",
    "crates/authkestra-policy",
    "crates/authkestra-ssf",
    "crates/authkestra-mcp",
]

[workspace.package]
edition = "2021"
version = "0.13.1"
repository = "https://github.com/marcjazz/authkestra"
license = "MIT OR Apache-2.0"
keywords = ["authentication", "oauth2", "oidc", "webauthn", "passwordless"]
categories = ["authentication", "web-programming"]
readme = "README.md"
exclude = [
    "/Cargo.lock",
    "tests/**/*",
    "examples/**/*",
    ".github/**/*",
    "docs/**/*",
    "design/**/*",
    "benches/**/*",
    ".gitignore",
    ".agents/**/*",
    "plans/**/*",
    "AGENTS.md",
    "docker-compose.yml"
]

[workspace.dependencies]
# `default-features = false` here so that a member crate can turn the default
# features of a sibling off. Cargo ignores `default-features = false` on an
# inherited dependency unless the workspace entry sets it too, which is what
# lets the TLS-backend choice below reach every crate in the graph.
authkestra-engine = { version = "0.13.1", path = "crates/authkestra-engine", default-features = false }
authkestra-providers = { version = "0.13.1", path = "crates/authkestra-providers", default-features = false }
authkestra-axum = { version = "0.13.1", path = "crates/authkestra-axum", default-features = false }
authkestra-macros = { version = "0.13.1", path = "crates/authkestra-macros", default-features = false }
authkestra-oidc = { version = "0.13.1", path = "crates/authkestra-oidc", default-features = false }
authkestra-actix = { version = "0.13.1", path = "crates/authkestra-actix", default-features = false }
authkestra-resource = { version = "0.13.1", path = "crates/authkestra-resource", default-features = false }

authkestra-op = { version = "0.13.1", path = "crates/authkestra-op", default-features = false }
authkestra-store-sqlx = { version = "0.13.1", path = "crates/authkestra-store-sqlx", default-features = false }
authkestra-store-testsuite = { version = "0.13.1", path = "crates/authkestra-store-testsuite" }
authkestra-devsig = { version = "0.13.1", path = "crates/authkestra-devsig", default-features = false }
authkestra-crypto-util = { version = "0.13.1", path = "crates/authkestra-crypto-util", default-features = false }
authkestra-policy = { version = "0.13.1", path = "crates/authkestra-policy", default-features = false }
authkestra-ssf = { version = "0.13.1", path = "crates/authkestra-ssf", default-features = false }

rand = "0.9.2"
url = "2.5"
sha2 = "0.10"
