[package]
exclude.workspace = true
name = "authkestra-ssf"
version.workspace = true
edition.workspace = true
description = "Shared Signals Framework for the authkestra framework: ingest and validate Security Event Tokens (RFC 8417), decode typed OpenID CAEP 1.0 events, and receive them over the RFC 8935 push delivery method"
repository.workspace = true
license.workspace = true
# "caep" and "rfc8417" are unambiguous, specific terms for this exact
# spec; "set" (Security Event Token) was deliberately not used as its own
# keyword despite being the standard's own acronym -- it collides with the
# common English word and would not discriminate anything in search.
keywords = ["caep", "rfc8417", "shared-signals", "security-events", "webhook"]
categories = ["authentication", "web-programming"]
readme = "README.md"

[dependencies]
async-trait = "0.1"
# Raw base64 decoding of the JOSE header, *before* `jsonwebtoken`'s typed API sees it. See
# `crate::verify` for why `alg: "none"` and a missing/wrong `typ` cannot be told apart from a
# corrupt token any other way.
base64 = "0.22.1"
jsonwebtoken = { version = "11", features = ["rust_crypto"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0.18"
tracing = "0.1"
authkestra-engine = { workspace = true, optional = true, default-features = false }

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
authkestra-engine = { workspace = true, features = ["memory", "rustls-aws-lc-rs"] }

[features]
default = ["rustls-aws-lc-rs"]
session = ["dep:authkestra-engine"]

# TLS backend forwarded to authkestra-engine
rustls-aws-lc-rs = ["authkestra-engine?/rustls-aws-lc-rs"]
rustls-no-provider = ["authkestra-engine?/rustls-no-provider"]
