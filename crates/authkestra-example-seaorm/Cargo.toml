[package]
exclude.workspace = true
name = "authkestra-example-seaorm"
version.workspace = true
edition.workspace = true
description = "Example: a real, compiled SeaORM-backed OpStore implementation, proving authkestra-op's storage traits are implementable by a third-party ORM (authkestra#289)"
repository.workspace = true
license.workspace = true
keywords.workspace = true
categories.workspace = true
readme.workspace = true
publish = false

[dependencies]
authkestra-op = { workspace = true, default-features = false }
authkestra-engine = { workspace = true, default-features = false }
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sea-orm = { version = "1", features = [
    "sqlx-sqlite",
    "runtime-tokio-rustls",
    "macros",
    "with-chrono",
    "with-json",
] }
tracing = "0.1"

[features]
default = ["rustls-aws-lc-rs"]
rustls-aws-lc-rs = ["authkestra-engine/rustls-aws-lc-rs", "authkestra-op/rustls-aws-lc-rs"]
rustls-no-provider = ["authkestra-engine/rustls-no-provider", "authkestra-op/rustls-no-provider"]

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
authkestra-store-testsuite = { workspace = true }
