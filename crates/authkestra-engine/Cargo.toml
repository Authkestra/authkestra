[package]
exclude.workspace = true
name = "authkestra-engine"
version.workspace = true
edition.workspace = true
description = "Unified authentication engine for the authkestra framework"
repository.workspace = true
license.workspace = true
readme.workspace = true
# The most specific, highest-search-volume terms for what this crate actually
# implements (webauthn-rs and totp-rs use exactly this pairing pattern —
# checked against their own published keywords rather than guessed). Deliberately
# its own set rather than `keywords.workspace = true`: the shared workspace
# keywords are the umbrella (auth/oauth2/oidc), and every other crate already
# carries those — this crate is the one place a search for the *methods*
# themselves (not the framework) should land.
keywords = ["webauthn", "passkeys", "totp", "2fa", "oauth2"]
categories = ["authentication", "web-programming"]

[dependencies]
# From authkestra-core
serde = { version = "1.0", features = ["derive"] }
# The TLS backend is selected by the `rustls-*` features below, not by
# reqwest's defaults, so consumers can pick their own crypto provider.
reqwest = { version = "0.13.1", default-features = false, features = [
    "json",
    "form",
    "charset",
    "http2",
    "system-proxy",
] }
url = { workspace = true }
http = "1"
thiserror = "2.0.18"
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
sha2 = { workspace = true }
# HMAC-SHA256 for stateless DPoP nonces (`token::dpop_nonce`). Already in the
# lockfile through other RustCrypto users; the 0.12 line pairs with sha2 0.10.
hmac = "0.12"
base64 = "0.22.1"
rand = { workspace = true }

# From authkestra-flow
serde_json = "1.0"
uuid = { version = "1.0", features = ["v4", "v5"] }
tracing = "0.1"

# From authkestra-token
jsonwebtoken = { version = "11", features = ["rust_crypto"] }
tokio = { version = "1.0", features = ["full"] }
aes-gcm = "0.10.3"
rsa = "0.9.6"
# Only used to derive the public key (for JWKS publishing) from an Ed25519
# PKCS#8 private key PEM — jsonwebtoken's own EncodingKey/DecodingKey types
# don't expose the raw key material needed for that. Already resolved in the
# workspace as jsonwebtoken's own `rust_crypto` EdDSA backend; the `pem`
# feature here only turns on its (already-present) `pkcs8`/PEM decoding.
ed25519-dalek = { version = "2", features = ["pem"] }

redis = { version = "0.27", features = ["tokio-comp"], optional = true }
sqlx = { version = "0.8.2", optional = true }
webauthn-rs = { version = "0.5.0", optional = true, features = ["danger-allow-state-serialisation"] }
totp-rs = { version = "5.7", features = ["gen_secret", "otpauth"], optional = true }
authkestra-crypto-util.workspace = true
argon2 = { version = "0.6.0", features = ["password-hash"] }
subtle = { version = "2.6", optional = true }
# Already in the dependency graph transitively; a direct, optional entry
# pulls nothing new into a build.
base32 = { version = "0.5", optional = true }

[features]
default = ["rustls-aws-lc-rs"]

# TLS backend for the outbound HTTP client. Exactly one of these must be
# enabled; the crate does not compile without a backend.
#
# `rustls-aws-lc-rs` is the default and keeps the historical behaviour
# (rustls with the `aws-lc-rs` provider, which builds C and assembly).
#
# `rustls-no-provider` leaves the choice of `rustls::CryptoProvider` to the
# application, which lets it use a pure-Rust provider such as `ring`. The
# application MUST install a provider before any `reqwest::Client` is built,
# otherwise reqwest panics at client construction:
#
# ```rust,ignore
# rustls::crypto::ring::default_provider()
#     .install_default()
#     .expect("failed to install rustls crypto provider");
# ```
rustls-aws-lc-rs = ["reqwest/rustls"]
rustls-no-provider = ["reqwest/rustls-no-provider"]

memory = []
redis = ["dep:redis"]
sql-postgres = ["sqlx/postgres", "sqlx/chrono", "sqlx/runtime-tokio-rustls", "sqlx/json"]
sql-mysql = ["sqlx/mysql", "sqlx/chrono", "sqlx/runtime-tokio-rustls", "sqlx/json"]
sql-sqlite = ["sqlx/sqlite", "sqlx/chrono", "sqlx/runtime-tokio-rustls", "sqlx/json"]
webauthn = ["dep:webauthn-rs"]
totp = ["dep:totp-rs"]
# No optional dependency: the secret is CSPRNG bytes and a SHA-256 hash,
# both of which the crate already pulls in. The gate exists to keep the
# AuthInput variant and the module out of builds that do not want them.
magic-link = []
# `subtle` is not optional decoration here: OTP allows several attempts by
# design, which is the condition that makes an early-exit comparison
# exploitable. See rfc-011 §4.7.
otp = ["dep:subtle"]
# Base32 rather than base64 for the codes: these are read off paper and
# typed, so case sensitivity and `+/` cost more than the denser alphabet
# saves.
recovery-codes = ["dep:base32"]
captcha = []

[[example]]
name = "totp_webauthn"
required-features = ["totp", "sql-sqlite"]

[dev-dependencies]

# Test-only: generating real EC P-256 keypairs and ES256-signing DPoP
# proofs with them, so token::dpop's tests exercise the actual EC path
# (the algorithm most real-world DPoP clients use) rather than only
# Ed25519. Already present in the dependency graph via jsonwebtoken's
# `rust_crypto` feature; declared directly here so tests can construct
# keys themselves — mirrors authkestra-op's identical dev-dependency,
# added there for the same reason (enrolment ceremony tests).
p256 = { version = "0.13", features = ["jwk"] }
rand_core = { version = "0.6", features = ["getrandom"] }

dotenvy = "0.15"
redis = { version = "0.27", features = ["tokio-comp"] }
reqwest = { version = "0.13", default-features = false, features = ["json"] }
tower-http = { version = "0.6", features = ["fs"] }
actix-files = "0.6"

testcontainers = "0.27.3"
testcontainers-modules = { version = "0.15.0", features = ["redis"] }
wiremock = "0.6.5"

# Test-only: captures emitted `tracing` output so the instrumentation on
# `Engine::authenticate` can be asserted on directly — both that it exists and,
# more importantly, that a password handed to it never reaches a log line
# (#353). Without a capturing subscriber that second property is unassertable,
# and it is precisely the one that would matter if it broke.
tracing-subscriber = { version = "0.3", features = ["fmt"] }

# Test-only: `test-util` brings `#[tokio::test(start_paused = true)]`, which
# `full` does not include. The device-flow tests use the paused clock to prove
# `poll_for_token` waits on a timer rather than blocking the thread (#306) --
# under a paused clock a real timer costs no wall-clock time, so a blocking
# sleep is unmistakable.
tokio = { version = "1.0", features = ["full", "test-util"] }
authkestra-store-testsuite = { path = "../authkestra-store-testsuite" }
