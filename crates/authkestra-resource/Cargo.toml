[package]
exclude.workspace = true
name = "authkestra-resource"
version.workspace = true
edition.workspace = true
description = "Resource server enforcement and validation for the authkestra framework"
repository.workspace = true
license.workspace = true
# "jwt" and "dpop" name the two concrete things this crate actually
# validates (RFC 9449 DPoP proof binding lives in src/dpop.rs) -- neither
# term was reachable through the old shared keyword set.
keywords = ["jwt", "dpop", "resource-server", "oauth2", "authentication"]
categories = ["authentication", "web-programming"]
readme = "README.md"

[dependencies]
authkestra-engine = { workspace = true, default-features = false }
async-trait = "0.1"
jsonwebtoken = { version = "11", features = ["rust_crypto"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# TLS backend comes from authkestra-engine's `rustls-*` features (see below).
reqwest = { version = "0.13.1", default-features = false, features = [
    "json",
    "charset",
    "http2",
    "system-proxy",
] }
tokio = { version = "1.0", features = ["full"] }
thiserror = "2.0.18"
http = "1"
base64 = "0.22.1"
tracing = "0.1"
chrono = { version = "0.4", features = ["serde"] }
# Validating `ValidationConfig::dpop_resource_origin`'s shape properly
# (scheme present, no query/fragment) instead of by hand-rolled string
# checks — the same crate `authkestra_engine::token::dpop` already uses for
# `htu` canonicalization, so parsing here agrees with parsing there.
url = { workspace = true }
authkestra-policy = { workspace = true, optional = true }

[features]
default = ["rustls-aws-lc-rs"]
policy = ["dep:authkestra-policy"]

# TLS backend, forwarded to authkestra-engine. See its documentation for the
# `rustls-no-provider` contract.
rustls-aws-lc-rs = ["authkestra-engine/rustls-aws-lc-rs"]
rustls-no-provider = ["authkestra-engine/rustls-no-provider"]

[dev-dependencies]
# Test-only: a token that fails validation is declined with `Ok(None)`, so the
# only record of *why* is the log line. Capturing emitted output is the only
# way to assert it (#353).
tracing-subscriber = { version = "0.3", features = ["fmt"] }
wiremock = "0.6"
rsa = "0.9.6"
rand = "0.8"
# Test-only: signing genuine DPoP proofs for JwtStrategy's DPoP-binding
# tests, mirroring authkestra-engine's own token::dpop test suite.
ed25519-dalek = "2"
# `MemoryStore`, used only by this crate's own `#[cfg(test)]` DPoP replay
# tests — not by any production code path here, so this feature belongs on
# the dev-dependency, not the main one. A downstream deployment that wants
# `MemoryStore` as a real `DpopReplayStore` still gets it by depending on
# `authkestra-engine` directly with this feature enabled.
authkestra-engine = { workspace = true, default-features = false, features = ["memory"] }
