[package]
exclude.workspace = true
name = "authkestra-actix"
version.workspace = true
edition.workspace = true
description = "Actix-web integration for the authkestra authentication framework"
repository.workspace = true
license.workspace = true
keywords = ["actix-web", "authentication", "oauth2", "session", "middleware"]
categories = ["authentication", "web-programming"]
readme = "README.md"

[dependencies]
authkestra-engine = { workspace = true, default-features = false }
authkestra-resource = { workspace = true, optional = true, default-features = false }
authkestra-op = { workspace = true, optional = true, default-features = false }
authkestra-mcp = { workspace = true, optional = true, default-features = false }
authkestra-macros = { workspace = true, optional = true, features = ["actix"] }
authkestra-devsig = { workspace = true, optional = true }
authkestra-policy = { workspace = true, optional = true }
authkestra-ssf = { workspace = true, optional = true, default-features = false }
actix-web = "4"
actix-utils = "3"
futures-util = "0.3"
futures = "0.3"
jsonwebtoken = "11"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
base64 = "0.22.1"
uuid = { version = "1.0", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
http = "1"

[features]
default = ["rustls-aws-lc-rs"]
session = []

# authkestra-engine now always compiles its token machinery in (see
# authkestra-engine's CHANGELOG / issue #376), so this no longer
# forwards anything — it only gates this crate's own token-issuing helpers.
token = []
resource = ["dep:authkestra-resource"]
op = ["dep:authkestra-op", "session", "token"]
mcp = ["dep:authkestra-mcp"]
policy = [
    "dep:authkestra-policy",
    "dep:authkestra-resource",
    "authkestra-resource/policy",
    "authkestra-mcp?/policy",
]
ssf = ["dep:authkestra-ssf", "authkestra-ssf/session"]
macros = ["dep:authkestra-macros"]
captcha = ["authkestra-engine/captcha"]
devsig = ["dep:authkestra-devsig"]

# TLS backend, forwarded to authkestra-engine. See its documentation for the
# `rustls-no-provider` contract.
rustls-aws-lc-rs = [
    "authkestra-engine/rustls-aws-lc-rs",
    "authkestra-resource?/rustls-aws-lc-rs",
    "authkestra-op?/rustls-aws-lc-rs",
    "authkestra-mcp?/rustls-aws-lc-rs",
    "authkestra-ssf?/rustls-aws-lc-rs",
]
rustls-no-provider = [
    "authkestra-engine/rustls-no-provider",
    "authkestra-resource?/rustls-no-provider",
    "authkestra-op?/rustls-no-provider",
    "authkestra-mcp?/rustls-no-provider",
    "authkestra-ssf?/rustls-no-provider",
]

[dev-dependencies]
async-trait = "0.1"
authkestra-engine = { workspace = true, features = ["memory"] }

# Test-only: the OAuth callback's three failure modes all return 401, so the
# only thing that tells a missing state cookie apart from an undecryptable one
# is the log line. Capturing emitted output is the only way to assert that
# (#353).
tracing-subscriber = { version = "0.3", features = ["fmt"] }

# Integration tests drive a real `actix_web::App` built with `Engine::actix_scope()`
# / `actix_scope_stateless()`, so they need the corresponding adapter features. Kept
# as separate `[[test]]` targets (rather than `#[cfg(feature = ...)]` inside one file)
# so `cargo test -p authkestra-actix` without `--all-features` simply skips them
# instead of failing to compile.
[[test]]
name = "engine_session_integration"
required-features = ["macros", "session"]

[[test]]
name = "engine_token_integration"
required-features = ["macros", "token"]

[[test]]
name = "auth_extensions_integration"
required-features = ["resource"]

[[test]]
name = "op_integration"
required-features = ["macros", "session", "token", "op"]

[[test]]
name = "devsig_test"
required-features = ["devsig"]

[[test]]
name = "mcp_integration"
required-features = ["mcp"]

[[test]]
name = "policy_integration"
required-features = ["policy"]

[[test]]
name = "ssf_integration"
required-features = ["ssf"]

[[test]]
name = "challenger_actix_ssf_tests"
required-features = ["ssf"]

