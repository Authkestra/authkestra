[package]
exclude.workspace = true
name = "authkestra"
version.workspace = true
edition.workspace = true
description = "The compile-time safe identity and AI agent authorization engine for Rust"
repository.workspace = true
license.workspace = true
keywords = ["authentication", "oauth2", "oidc", "mcp", "ai-agents"]
categories = ["authentication", "web-programming"]
readme = "README.md"

[dependencies]
authkestra-engine = { workspace = true, optional = true, default-features = false }
authkestra-oidc = { workspace = true, optional = true, default-features = false }
authkestra-axum = { workspace = true, optional = true, default-features = false }
authkestra-actix = { workspace = true, optional = true, default-features = false }
authkestra-providers = { workspace = true, optional = true, default-features = false }
authkestra-resource = { workspace = true, optional = true, default-features = false }
authkestra-op = { workspace = true, optional = true, default-features = false }
authkestra-devsig = { workspace = true, optional = true }
authkestra-policy = { workspace = true, optional = true, default-features = false }
authkestra-ssf = { workspace = true, optional = true, default-features = false }
authkestra-mcp = { workspace = true, optional = true, default-features = false }

[dev-dependencies]
reqwest = { version = "0.13", default-features = false, features = ["json"] }
serde_json = "1.0"
tokio = { version = "1", features = ["full"] }
wiremock = "0.6"

authkestra-engine = { workspace = true, features = ["memory", "redis", "totp", "webauthn"] }
authkestra-resource = { workspace = true }
authkestra-providers = { workspace = true, features = ["github", "google", "discord"] }
authkestra-oidc = { workspace = true }
authkestra-op = { workspace = true }
authkestra-mcp = { workspace = true }
authkestra-store-sqlx = { workspace = true, features = ["sqlite"] }
authkestra-macros = { workspace = true }
authkestra-devsig = { workspace = true }
authkestra-axum = { workspace = true, features = ["devsig", "macros", "session", "token", "resource", "op", "captcha", "mcp"] }
authkestra-actix = { workspace = true, features = ["devsig", "macros", "session", "token", "resource", "op", "captcha", "mcp"] }

dotenvy = "0.15"
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite"] }
redis = { version = "0.27", features = ["tokio-comp"] }
tower-http = { version = "0.6", features = ["fs"] }
actix-files = "0.6"
rsa = "0.9"
p256 = { version = "0.13", features = ["pem", "ecdsa", "jwk"] }
rand_core = { version = "0.6", features = ["getrandom"] }
rand = "0.8"
sha2 = "0.10"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
async-trait = "0.1.91"
webauthn-rs = "0.5.0"
url = "2.5"
axum = { version = "0.8.8", features = ["macros"] }
actix-web = "4"
tower-cookies = "0.11.0"
tower-layer = "0.3"
tower-service = "0.3"
jsonwebtoken = { version = "11", features = ["rust_crypto"] }
serde = { version = "1.0", features = ["derive"] }
base64 = "0.22.1"
uuid = { version = "1.0", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }

[features]
default = ["engine", "rustls-aws-lc-rs"]
# Every authentication capability this crate has. Two kinds of feature are
# deliberately left out, and both are *choices* rather than capabilities:
#
# - The TLS backend (`rustls-*`): exactly one is meant to be active, and which
#   one depends on the deployment (C toolchain vs pure Rust, `cargo-deny`
#   policy). `default` picks one.
# - The storage backends (`memory`, `redis`, `sql-*`): an application picks the
#   store it actually runs. Naming them here would put a Redis client and three
#   SQL drivers into every `full` build to no purpose, since only one gets
#   used. `full` means "every way of authenticating"; the store is yours to
#   name alongside it — e.g. `features = ["full", "sql-postgres"]`.
#
# This list drifts silently if left to discipline — it omitted twelve
# features between #369 adding them and this being noticed — so
# `authkestra-facade-tests` asserts it stays exhaustive rather than trusting
# whoever adds the next one to remember. The two exclusions above are declared
# there too, so removing one from this list without a reason fails the build.
full = [
    "engine",
    "oidc",
    "resource",
    "axum",
    "actix",
    "github",
    "google",
    "discord",
    "webauthn",
    "totp",
    "magic-link",
    "otp",
    "recovery-codes",
    "captcha",
    "macros",
    "op",
    "devsig",
    "policy",
    "ssf",
    "mcp",
]
engine = ["dep:authkestra-engine"]

# TLS backend, forwarded to every sub-crate that speaks HTTPS. See
# authkestra-engine's documentation for the `rustls-no-provider` contract.
rustls-aws-lc-rs = [
    "authkestra-engine?/rustls-aws-lc-rs",
    "authkestra-oidc?/rustls-aws-lc-rs",
    "authkestra-axum?/rustls-aws-lc-rs",
    "authkestra-actix?/rustls-aws-lc-rs",
    "authkestra-providers?/rustls-aws-lc-rs",
    "authkestra-resource?/rustls-aws-lc-rs",
    "authkestra-op?/rustls-aws-lc-rs",
    "authkestra-mcp?/rustls-aws-lc-rs",
    "authkestra-ssf?/rustls-aws-lc-rs",
]
rustls-no-provider = [
    "authkestra-engine?/rustls-no-provider",
    "authkestra-oidc?/rustls-no-provider",
    "authkestra-axum?/rustls-no-provider",
    "authkestra-actix?/rustls-no-provider",
    "authkestra-providers?/rustls-no-provider",
    "authkestra-resource?/rustls-no-provider",
    "authkestra-op?/rustls-no-provider",
    "authkestra-mcp?/rustls-no-provider",
    "authkestra-ssf?/rustls-no-provider",
]

# Core features
#
# There is deliberately no `session` or `token` feature here. Both became
# empty once `authkestra-engine` dropped its own `session` feature (#375)
# and made its token machinery unconditional (#377): they forwarded nothing,
# and each gated a re-export that was itself a duplicate name for the engine
# (see this crate's `src/lib.rs`). What they gated is reached through
# `engine` — `authkestra::core`, and `authkestra::store` under any storage
# backend below.

oidc = ["dep:authkestra-oidc"]
resource = ["dep:authkestra-resource", "authkestra-actix?/resource", "authkestra-axum?/resource"]
# Shared Signals Framework / CAEP ingestion with Axum/Actix push receiver routes and session revocation.
ssf = [
    "dep:authkestra-ssf",
    "authkestra-axum?/ssf",
    "authkestra-actix?/ssf",
]

# Cedar policy engine for ABAC authorization guards, extractors, and MCP tool enforcement.
policy = [
    "dep:authkestra-policy",
    "authkestra-resource?/policy",
    "authkestra-mcp?/policy",
    "authkestra-axum?/policy",
    "authkestra-actix?/policy",
]

# Model Context Protocol (MCP) server security guard, HITL step-up approval & zero-trust token broker
mcp = ["dep:authkestra-mcp", "authkestra-axum?/mcp", "authkestra-actix?/mcp"]

# Web frameworks
axum = ["dep:authkestra-axum", "authkestra-axum/macros", "authkestra-axum/session", "authkestra-axum/token", "authkestra-axum/resource"]
actix = ["dep:authkestra-actix", "authkestra-actix/session", "authkestra-actix/token", "authkestra-actix/resource"]

# Providers
github = ["authkestra-providers/github"]
google = ["authkestra-providers/google"]
discord = ["authkestra-providers/discord"]

# Storage backends. Forwarded to the engine, and to `authkestra-op` where it
# has a matching backend of its own, so an application picks a store once
# rather than per sub-crate. Each backend requires the engine.
memory = ["engine", "authkestra-engine/memory"]
redis = ["engine", "authkestra-engine/redis", "authkestra-op?/redis"]
sql-postgres = ["engine", "authkestra-engine/sql-postgres"]
sql-mysql = ["engine", "authkestra-engine/sql-mysql"]
sql-sqlite = ["engine", "authkestra-engine/sql-sqlite"]

# Authentication methods beyond sessions and OAuth. Each method requires the engine.
webauthn = ["engine", "authkestra-engine/webauthn"]
totp = ["engine", "authkestra-engine/totp"]
magic-link = ["engine", "authkestra-engine/magic-link"]
otp = ["engine", "authkestra-engine/otp"]
recovery-codes = ["engine", "authkestra-engine/recovery-codes"]
captcha = [
    "engine",
    "authkestra-engine/captcha",
    "authkestra-axum?/captcha",
    "authkestra-actix?/captcha",
]

# Adapter extras. `?` throughout: turning one of these on must not drag in a
# web framework the application never asked for.
#
# `macros` is a no-op for axum, whose facade feature already enables it, and
# is the only way to reach the `ActixState` derive — that asymmetry predates
# this and is left alone here, since removing it from `axum` would break
# anyone relying on it.
macros = ["authkestra-axum?/macros", "authkestra-actix?/macros"]
op = ["dep:authkestra-op", "authkestra-axum?/op", "authkestra-actix?/op"]
devsig = [
    "dep:authkestra-devsig",
    "authkestra-axum?/devsig",
    "authkestra-actix?/devsig",
]
